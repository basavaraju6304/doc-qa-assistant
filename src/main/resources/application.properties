spring.application.name=doc-qa-assistant

# Chat model (the one that answers)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash

# Embedding model (used later for RAG; key only for now)
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB